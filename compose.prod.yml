services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simplp_ai
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - model_cache:/root/.cache
    networks:
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.simplp-ai.rule=Host(`sim-plp-ai.gou.web.id`)"
      - "traefik.http.routers.simplp-ai.entrypoints=websecure"
      - "traefik.http.routers.simplp-ai.tls.certresolver=myresolver"
      - "traefik.http.services.simplp-ai.loadbalancer.server.port=8000"

volumes:
  model_cache:

networks:
  web_proxy:
    external: true
