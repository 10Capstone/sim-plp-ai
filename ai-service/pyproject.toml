[project]
name = "ai-service"
version = "0.1.0"
description = "Async retrieval API for an existing Indonesian Qdrant collection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "flashrank>=0.2.10",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
